<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kod nauczyciela</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        display: grid;
        place-items: center;
        background: #fbfcfd;
        color: #25323b;
        font-family: 'Nunito', system-ui, sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 440px; }
      h1 { margin: 0 0 24px; font-size: 18px; font-weight: 900; color: #66757f; text-transform: uppercase; letter-spacing: 1px; }
      button {
        width: 100%;
        min-height: 72px;
        border: 0;
        border-bottom: 6px solid #46a302;
        border-radius: 18px;
        background: #58cc02;
        color: white;
        font: inherit;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:active { transform: translateY(3px); }
      output {
        min-height: 1.2em;
        margin-top: 28px;
        display: block;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: clamp(40px, 13vw, 64px);
        font-weight: 900;
        letter-spacing: 4px;
      }
      p { margin: 8px 0 0; color: #66757f; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kod nauczyciela</h1>
      <button type="button" id="show-code">Kod</button>
      <output id="code" aria-live="polite"></output>
      <p id="code-time"></p>
    </main>
    <script src="teacher-code.js?v=1"></script>
    <script>
      document.querySelector('#show-code').addEventListener('click', () => {
        const now = new Date();
        document.querySelector('#code').textContent = teacherCodeAt(now);
        document.querySelector('#code-time').textContent =
          `Wygenerowano o ${now.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })} — ważny około minuty.`;
      });
    </script>
  </body>
</html>
