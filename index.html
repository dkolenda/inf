<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="description" content="Interaktywne zadania z informatyki dla uczniów." />
    <title>Informatyczna Przygoda</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Informatyka" />
    <link rel="stylesheet" href="styles.css?v=61" />
  </head>
  <body>
    <div id="app"></div>

    <template id="home-template">
      <header class="topbar">
        <a class="brand" href="#/" aria-label="Informatyczna Przygoda — strona główna">
          <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
          <span>Informatyczna<br /><strong>Przygoda</strong></span>
        </a>
        <div class="header-progress" role="progressbar" aria-label="Postęp we wszystkich tematach" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="stats" aria-label="Twoje postępy">
          <span class="stat stat-points"><span aria-hidden="true">◆</span><b>0</b><small>punktów</small></span>
          <button class="avatar" type="button" aria-label="Profil ucznia">MK</button>
        </div>
      </header>

      <main class="home-view">
        <section class="topics" aria-labelledby="topics-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Wybierz swoją ścieżkę</p>
              <h2 id="topics-title">Czego chcesz się dziś nauczyć?</h2>
            </div>
            <p>Każdy temat to osobna przygoda. Zacznij od dowolnego miejsca.</p>
          </div>
          <div class="topic-grid" id="topic-grid"></div>
        </section>

        <section class="motivation" aria-label="Motywacja do nauki">
          <div class="motivation-icon" aria-hidden="true">🏆</div>
          <div>
            <p class="eyebrow">Małymi krokami do celu</p>
            <h2>Gotowy na dzisiejsze wyzwanie?</h2>
            <p>Wykonuj zadania, zdobywaj punkty i obserwuj, jak rosną Twoje umiejętności.</p>
          </div>
          <a class="secondary-button" href="#/sciezka/praca-na-komputerze">Wybierz zadanie</a>
        </section>
      </main>

      <footer>
        <span>Informatyczna Przygoda</span>
        <span>Nauka przez działanie 🚀</span>
      </footer>
    </template>

    <template id="path-template">
      <header class="topbar path-topbar">
        <a class="brand" href="#/" aria-label="Wróć na stronę główną">
          <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
          <span>Informatyczna<br /><strong>Przygoda</strong></span>
        </a>
        <div class="header-progress" role="progressbar" aria-label="Postęp we wszystkich tematach" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="stats" aria-label="Twoje postępy">
          <span class="stat stat-points"><span aria-hidden="true">◆</span><b>0</b><small>punktów</small></span>
          <button class="avatar" type="button" aria-label="Profil ucznia">MK</button>
        </div>
      </header>

      <main class="path-layout">
        <aside class="path-sidebar">
          <a class="back-link" href="#/"><span aria-hidden="true">←</span> Wszystkie tematy</a>
          <div class="side-card">
            <span class="side-icon" id="side-icon" aria-hidden="true"></span>
            <p class="eyebrow">Twoja ścieżka</p>
            <h1 id="path-title"></h1>
            <p id="path-description"></p>
            <div class="progress-label"><span>Postęp</span><strong>2 z 7</strong></div>
            <div class="progress-track"><span style="width: 29%"></span></div>
          </div>
          <div class="tip-card">
            <span aria-hidden="true">💡</span>
            <div><strong>Wskazówka</strong><p>Wykonuj zadania po kolei, aby odblokować następne etapy.</p></div>
          </div>
        </aside>

        <section class="learning-path" aria-labelledby="unit-title">
          <div class="unit-banner">
            <div>
              <span>ROZDZIAŁ 1</span>
              <h2 id="unit-title">Pierwsze kroki</h2>
              <p>Poznaj podstawy i zdobądź pierwsze punkty.</p>
            </div>
            <div class="unit-progress"><strong>29%</strong><span>ukończono</span></div>
          </div>

          <div class="trail" id="trail" aria-label="Lista zadań"></div>

          <div class="coming-soon">
            <span aria-hidden="true">🎯</span>
            <div><strong>Meta ścieżki</strong><p>Ukończ wszystkie 7 zadań i zdobądź mistrzowski wynik.</p></div>
          </div>
        </section>
      </main>
    </template>

    <template id="quiz-template">
      <div class="quiz-view">
        <header class="quiz-topbar">
          <a class="quiz-close" id="quiz-close" href="#/" aria-label="Zakończ quiz i wróć do ścieżki">×</a>
          <div class="quiz-progress" role="progressbar" aria-label="Postęp quizu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
          <span class="stat stat-points"><span aria-hidden="true">◆</span><b>0</b><small>punktów</small></span>
        </header>

        <main class="quiz-main">
          <p class="eyebrow" id="quiz-kicker"></p>
          <h1 id="quiz-prompt"></h1>
          <p class="quiz-hint" id="quiz-hint"></p>
          <details class="quiz-tip" id="quiz-tip" hidden>
            <summary></summary>
            <ol class="quiz-tip-steps"></ol>
          </details>
          <figure class="quiz-art" id="quiz-art" hidden></figure>
          <div class="quiz-body" id="quiz-body"></div>
        </main>

        <div class="quiz-footer" id="quiz-footer">
          <div class="quiz-footer-inner">
            <div class="quiz-feedback" id="quiz-feedback" aria-live="polite"></div>
            <div class="quiz-actions">
              <button class="secondary-button quiz-back" id="quiz-back" type="button" hidden><span aria-hidden="true">←</span> Wstecz</button>
              <button class="secondary-button quiz-fix" id="quiz-fix" type="button" hidden>Popraw</button>
              <button class="primary-button quiz-check" id="quiz-check" type="button" disabled>Sprawdź</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <dialog class="welcome-dialog" id="welcome-dialog" aria-labelledby="welcome-title">
      <form class="welcome-card" id="welcome-form" method="dialog">
        <div class="welcome-icon" aria-hidden="true">&lt;/&gt;</div>
        <p class="eyebrow">Zanim zaczniemy</p>
        <h2 id="welcome-title">Jak masz na imię?</h2>
        <p>Podaj swoje imię, a dopasujemy Informatyczną Przygodę do Ciebie.</p>
        <label for="student-name">Twoje imię</label>
        <input id="student-name" name="student-name" type="text" autocomplete="name" minlength="2" maxlength="24" placeholder="Np. Ola" required />
        <p class="welcome-error" id="welcome-error" role="alert" aria-live="polite"></p>
        <button class="primary-button welcome-submit" type="submit">Zaczynamy <span aria-hidden="true">→</span></button>
      </form>
    </dialog>

    <dialog class="lesson-dialog" id="lesson-dialog">
      <button class="dialog-close" type="button" aria-label="Zamknij">×</button>
      <div class="dialog-icon" id="dialog-icon">✓</div>
      <p class="eyebrow" id="dialog-kicker">Zadanie</p>
      <h2 id="dialog-title">Zadanie 1</h2>
      <p id="dialog-copy">Treść tego zadania dodamy później.</p>
      <button class="primary-button dialog-action" type="button">Rozumiem</button>
    </dialog>

    <dialog class="reward-dialog" id="reward-dialog" aria-labelledby="reward-title">
      <div class="reward-card">
        <div class="reward-stage" aria-hidden="true">
          <span class="reward-spark s1">★</span>
          <span class="reward-spark s2">✦</span>
          <span class="reward-spark s3">●</span>
          <img class="reward-character" id="reward-character" alt="" />
          <span class="reward-floor"></span>
        </div>
        <h2 id="reward-title">Świetnie!</h2>
        <p id="reward-copy">Wszystkie odpowiedzi poprawne.</p>
        <div class="reward-stats">
          <div class="reward-stat reward-stat-points">
            <span class="reward-stat-label">Punkty</span>
            <span class="reward-stat-value"><span aria-hidden="true">⚡</span> +<b id="reward-points">0</b></span>
          </div>
          <div class="reward-stat reward-stat-correct">
            <span class="reward-stat-label">Poprawne</span>
            <span class="reward-stat-value"><span aria-hidden="true">✓</span> <b id="reward-correct">0</b></span>
          </div>
          <div class="reward-stat reward-stat-accuracy">
            <span class="reward-stat-label">Celność</span>
            <span class="reward-stat-value"><span aria-hidden="true">◎</span> <b id="reward-accuracy">0</b>%</span>
          </div>
        </div>
        <button class="primary-button reward-action" id="reward-action" type="button">Dalej <span aria-hidden="true">→</span></button>
        <button class="secondary-button reward-review" id="reward-review" type="button">Zobacz, gdzie był błąd</button>
      </div>
      <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>
    </dialog>

    <script src="quizzes.js?v=54"></script>
    <script src="file-game.js?v=5"></script>
    <script src="balloon-game.js?v=1"></script>
    <script src="network-game.js?v=7"></script>
    <script src="fake-news-game.js?v=1"></script>
    <script src="typing-game.js?v=3"></script>
    <script src="teacher-code.js?v=1"></script>
    <script src="computer-task.js?v=5"></script>
    <script src="coloring-game.js?v=6"></script>
    <script src="pivot-animator.js?v=6"></script>
    <script src="code-game.js?v=9"></script>
    <script src="board-code-game.js?v=2"></script>
    <script src="kosmo-kroki.js?v=16"></script>
    <script src="app.js?v=35"></script>
    <script src="pwa.js?v=1"></script>
  </body>
</html>
